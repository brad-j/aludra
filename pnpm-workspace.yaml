allowBuilds:
  '@google/genai': false
  esbuild: false
  protobufjs: false
# Package versions must be 3 days old before pnpm resolves them (pnpm's default is 1 day).
minimumReleaseAge: 4320
# pi-coding-agent 1.3.0 pins undici 8.10.2 and minimatch 10.2.6, which have advisories.
# pi-coding-agent 1.5.0 uses undici 8.12.3 and minimatch 11.0.3; drop these when upgrading it.
overrides:
  '@earendil-works/pi-coding-agent>undici': 8.12.3
  '@earendil-works/pi-coding-agent>minimatch': 11.0.3
